name: Tag release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged release
    if: "contains(github.event.head_commit.message, 'chore(release): bump version to ')"
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the annotated tag and its GitHub release.
      pull-requests: read # Verify the commit came from a labeled release pull request.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(printf '%s\n' "${HEAD_MESSAGE}" | sed -n 's/^chore(release): bump version to \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n1)"
          [ -n "${version}" ] || { echo "Could not parse release version."; exit 1; }
          project_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          [ "${version}" = "${project_version}" ] || { echo "Release version mismatch."; exit 1; }

          pr_number="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq 'map(select(.base.ref == env.DEFAULT_BRANCH)) | .[0].number // empty')"
          [ -n "${pr_number}" ] || { echo "Release commit is not associated with a PR."; exit 1; }
          gh api "repos/${REPOSITORY}/issues/${pr_number}/labels" --jq '.[].name' | grep -qx release

          tag="v${version}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
            git tag -a "${tag}" -m "Release ${tag}"
            git push origin "refs/tags/${tag}"
          fi
          gh release view "${tag}" >/dev/null 2>&1 || \
            gh release create "${tag}" --generate-notes --verify-tag
