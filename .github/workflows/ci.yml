name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run --extra dev ruff check .

      - name: Format check (black)
        run: uv run --extra dev black --check .

      - name: Tests (pytest, SDK)
        run: uv run --extra dev pytest -q

      # One process per competition: each ships its own top-level `env` package (they are
      # separate repos in real life), so a single pytest process cannot import two of them.
      - name: Tests (pytest, competitions)
        run: |
          for d in competitions/*/tests; do
            [ -d "$d" ] || continue
            echo "== $d"
            uv run --extra dev pytest -q "$d"
          done
