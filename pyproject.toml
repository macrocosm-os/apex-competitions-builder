[project]
name = "apex-competition-sdk"
version = "0.1.0"
description = "Contracts and tooling for building Apex competitions (spec schema, gym_v1 protocol, apex-dev harness)."
authors = [{ name = "Macrocosmos.ai" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.scripts]
apex-dev = "apex_sdk.dev.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole package (including schema/*.json data files) ships under src/apex_sdk.
packages = ["src/apex_sdk"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
