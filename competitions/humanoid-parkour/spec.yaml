schema: apex.competition.v1
id: humanoid_parkour
version: 0.1.0
display_name: "Humanoid Parkour"
kind: solo
process_type: cpu

resources:
  cpu_limit: 1
  mem_limit: 1.5Gi
  gpu_count: 0

# Built + keyless-cosign-signed by this repo's release workflow (see
# .github/workflows/release.yml); digests from the signed ghcr manifests.
# `image` is the PLAYER image (loads + serves the miner's ONNX policy).
image:
  ref: ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-player
  digest: sha256:b1f5eec03fc92056c89a6105409d66691aa0cc39b5e73f2c55328ea6501fe342

# ONNX artifact: the miner submits a policy graph, not code. The player image
# validates the interface ([1,56] float32 in -> [1,17] float32 out) at load
# time; there is no code to screen and no Layer-2 screen image needed.
submission:
  artifact_type: onnx
  max_size_mb: 25
  target_path: /app/submission.onnx

screening:            # Layer-1 generic weights validator (onnx artifact_type)
  max_size_mb: 25
  min_weight_bytes: 10000        # rejects near-empty graphs / constant policies
  max_code_weight_ratio: 0.1

input_schema:
  $ref: ./input.schema.json

defaults:
  baseline_score: 0.0
  # Measured: mean over 20 master seeds at N=120 courses with the released
  # PPO baseline (baseline/baseline.onnx); per-seed numbers in HANDOFF.md §4.
  baseline_raw_score: 0.487
  round_length_in_days: 2
  submission_reveal_days: 5      # trained policies carry real R&D; protect them
  lower_is_better: false

entrypoints:
  # The PLAYER sandbox: serves the ONNX policy over gym_v1; the referee drives
  # it one observation at a time. timeout_s must cover the whole evaluation
  # (120 courses x <=900 control steps; measured ~15 s for the baseline,
  # ~6 min worst case for a policy surviving every step).
  evaluate:
    command: ["python", "/app/launch.py", "--port", "8000"]
    network_disabled: false   # the referee must reach the player on the per-job network
    allow_internet: false
    timeout_s: 900
    http_api:
      port: 8000
      readiness_path: /health
      protocol: gym_v1

# The scorer sandbox: MuJoCo physics, course generation from the per-round
# SEED, termination gates, scoring. No generate_round entrypoint: the platform
# seed is enough (the referee derives all courses from it deterministically).
referee:
  protocol: gym_v1
  image:
    ref: ghcr.io/macrocosm-os/apex-competition-humanoid-parkour-referee
    digest: sha256:8f78c73caa656b5c04f56f3c62171a7005c94eaa1450788fd942cb3456885bc7
  timeout_s: 900

signature:
  cosign_identity: https://github.com/macrocosm-os/apex-competition-humanoid-parkour/.github/workflows/release.yml
  cosign_issuer: https://token.actions.githubusercontent.com
