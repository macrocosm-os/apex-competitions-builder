name: Refresh ground truth

# Daily cron: pulls newly-published EIA-930 actuals and (a) appends them to
# the pinned history CSVs used to build next round's "live" input windows,
# and (b) publishes the day's now-realized outcomes as a signed ground-truth
# feed for the proposed `entrypoints.resolve` (see ../../PLATFORM_PROPOSAL.md).
# This is the ONLY job in this competition allowed to reach the internet --
# it runs on GitHub-hosted infra, not inside any Apex sandbox, and produces
# no code that a miner submission or the player image ever executes.
on:
  schedule:
    - cron: "17 6 * * *" # once daily; EIA-930 actuals finalize with a ~1-2 day lag
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write # for cosign keyless signing of the published feed

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy==2.3.4
      - name: Fetch EIA-930 actuals and publish ground-truth feed
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python resolver/fetch_ground_truth.py
      - name: Sign the published ground-truth feed (keyless cosign)
        run: |
          cosign sign-blob --yes \
            --output-signature data/ground_truth/$(date -u -d '2 days ago' +%F).json.sig \
            data/ground_truth/$(date -u -d '2 days ago' +%F).json
      - name: Commit refreshed data
        run: |
          git config user.name "energy-forecast-bot"
          git config user.email "noreply@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: daily data refresh $(date -u +%F)"
          git push
